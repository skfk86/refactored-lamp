Name: 🏗️ Build Sira App
on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed release AAB?'
        required: true
        default: 'false'
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    name: 🤖 Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps
      - name: 🤖 Add Android platform
        run: npx cap add android || true
      - name: 🔄 Sync Capacitor → Android
        run: npx cap sync android
      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: 📝 Accept SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true
      - name: 🔔 Patch AndroidManifest — Notification permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />|' "$MANIFEST"
            echo "✅ Notification permissions added"
          else
            echo "ℹ️ Permissions already present"
          fi
      - name: 🔧 Make Gradle executable
        run: chmod +x android/gradlew
      - name: 🔑 Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > android/app/sira-release.keystore
      - name: 🔏 Configure release signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          python3 - << 'PYEOF'
          import re
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()
          signing_block = """
    signingConfigs {
        release {
            storeFile     file('sira-release.keystore')
            storePassword (System.getenv('STORE_PASSWORD') ?: '')
            keyAlias      (System.getenv('KEY_ALIAS')       ?: '')
            keyPassword   (System.getenv('KEY_PASSWORD')    ?: '')
        }
    }
"""
          if 'signingConfigs' not in content:
              content = content.replace('    buildTypes {', signing_block + '    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in content:
              content = re.sub(r'(        release \{)', r'\1\n            signingConfig signingConfigs.release', content, count=1)
          with open(gradle_path, 'w') as f:
              f.write(content)
          print('✅ Signing configured')
          PYEOF
      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: سيرة-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: 🏭 Build Release AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' && (startsWith(github.ref, 'refs/tags/') || inputs.build_release == 'true') }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
      - name: 📤 Upload Release AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' && (startsWith(github.ref, 'refs/tags/') || inputs.build_release == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: سيرة-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
      - name: 🏭 Build Signed APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' && startsWith(github.ref, 'refs/tags/') }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "سيرة ${{ github.ref_name }}"
          body: |
            ## 📱 إصدار جديد من تطبيق **سيرة** — ${{ github.ref_name }}
            ### ✨ الميزات:
            - 30 قالب احترافي (5 مجانية)
            - الشهادات السودانية
            - حقول الاستمارة السودانية
            - صورة شخصية
            - تصدير PDF + Word
            - 🔔 **إشعارات وتذكيرات** (جديد)
            - يعمل بدون إنترنت
            ### 📥 التحميل:

| الملف | الاستخدام |
| :--- | :--- |
| `app-debug.apk` | تثبيت مباشر للاختبار |
| `app-release.apk` | تثبيت مباشر موقّع |
| `app-release.aab` | رفع على Google Play |

            ### 📋 المتطلبات: Android 7.0+ (API 24)
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🏗️ Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "| Debug APK | ✅ $(du -sh $APK | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Debug APK | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
